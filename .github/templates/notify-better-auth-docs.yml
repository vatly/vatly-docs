# Copy to .github/workflows/notify-docs.yml in the Better Auth package repo.
name: Notify Docs

on:
  push:
    branches: [main]
    paths: [docs/**]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger docs sync
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.VATLY_DOCS_DISPATCH_TOKEN }}
          repository: vatly/vatly-docs
          event-type: sync-better-auth-docs
