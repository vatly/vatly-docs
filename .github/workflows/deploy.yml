name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # docus 5.13's dependency tree (nuxt-og-image 6 + @takumi-rs, sharp/ipx
      # platform packages) needs npm 11 — npm 10 fails to install it
      # (`npm ci` EBADPLATFORM on optional platform deps; `npm install` crashes
      # with an arborist `edgesOut` error).
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Build
        run: npx nuxi build

      - name: Add CNAME
        run: echo "docs.vatly.com" > .output/public/CNAME

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/vatly/vatly-docs.git
          npx gh-pages --dotfiles -d .output/public
