name: Sync SDK Docs

on:
  repository_dispatch:
    types: [sync-sdk-docs, sync-fluent-php-docs, sync-laravel-docs, sync-js-docs, sync-fluent-js-docs, sync-better-auth-docs, sync-python-docs, sync-fluent-python-docs, sync-django-docs]
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

# GitHub keeps one running and only the latest pending run. Never interrupt a
# running commit/deployment; the next run imports every source again anyway.
concurrency:
  group: sdk-docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      SYNC_BETTER_AUTH_DOCS: ${{ vars.SYNC_BETTER_AUTH_DOCS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Omitting ref selects each source repository's current default branch.
      - name: Pull PHP SDK docs
        uses: actions/checkout@v4
        with:
          repository: vatly/vatly-api-php
          path: tmp/sdk-repo
          sparse-checkout: docs

      - name: Pull PHP Fluent docs
        uses: actions/checkout@v4
        with:
          repository: vatly/vatly-fluent-php
          path: tmp/fluent-php-repo
          sparse-checkout: docs

      - name: Pull Laravel package docs
        uses: actions/checkout@v4
        with:
          repository: vatly/vatly-laravel
          path: tmp/laravel-repo
          sparse-checkout: docs

      - name: Pull JavaScript SDK docs
        uses: actions/checkout@v4
        with:
          repository: vatly/vatly-api-js
          path: tmp/js-repo
          sparse-checkout: docs
          token: ${{ secrets.VATLY_DOCS_SOURCE_TOKEN || github.token }}

      - name: Pull JavaScript Fluent docs
        uses: actions/checkout@v4
        with:
          repository: vatly/vatly-fluent-js
          path: tmp/fluent-js-repo
          sparse-checkout: docs
          token: ${{ secrets.VATLY_DOCS_SOURCE_TOKEN || github.token }}

      - name: Pull Python SDK docs
        uses: actions/checkout@v4
        with:
          repository: vatly/vatly-api-python
          path: tmp/python-repo
          sparse-checkout: docs

      - name: Pull Python Fluent docs
        uses: actions/checkout@v4
        with:
          repository: vatly/vatly-fluent-python
          path: tmp/fluent-python-repo
          sparse-checkout: docs

      - name: Pull Django docs
        uses: actions/checkout@v4
        with:
          repository: vatly/vatly-django
          path: tmp/django-repo
          sparse-checkout: docs

      - name: Pull Better Auth docs
        if: vars.SYNC_BETTER_AUTH_DOCS == 'true'
        uses: actions/checkout@v4
        with:
          repository: vatly/vatly-better-auth-js
          path: tmp/better-auth-repo
          sparse-checkout: docs
          token: ${{ secrets.VATLY_DOCS_SOURCE_TOKEN || github.token }}

      - name: Regenerate all package docs and sitemap
        run: bash scripts/sync-package-docs.sh

      - name: Commit changes with optimistic retry (signed via GitHub API)
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3; do
            git add content/3.packages/ public/sitemap.xml
            if git diff --staged --quiet; then
              echo "All package docs are current; no commit or deployment needed."
              exit 0
            fi
            HEAD_OID=$(git rev-parse HEAD)
            additions=$(git diff --staged --no-renames -z --name-only --diff-filter=ACM \
              | while IFS= read -r -d '' f; do
                  jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" \
                    '{path: $path, contents: $contents}'
                done | jq -s '.')
            deletions=$(git diff --staged --no-renames -z --name-only --diff-filter=D \
              | while IFS= read -r -d '' f; do
                  jq -n --arg path "$f" '{path: $path}'
                done | jq -s '.')
            jq -n \
              --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }' \
              --arg repo "$REPO" --arg oid "$HEAD_OID" \
              --argjson additions "$additions" --argjson deletions "$deletions" \
              '{query: $query, variables: {input: {
                  branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                  message: {headline: "docs: sync SDK documentation"},
                  expectedHeadOid: $oid,
                  fileChanges: {additions: $additions, deletions: $deletions}
              }}}' > "$RUNNER_TEMP/docs-commit.json"
            if gh api graphql --input "$RUNNER_TEMP/docs-commit.json"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Retry only a branch advance, not auth/validation failures. Rebase
            # the generated result onto fresh main by regenerating, rather than
            # choosing conflict sides and risking concurrent handwritten edits.
            remote_oid=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
            if [[ "$remote_oid" == "$HEAD_OID" || "$attempt" == 3 ]]; then
              exit 1
            fi
            echo "main advanced; refreshing and regenerating (attempt $((attempt + 1)))."
            git reset --hard HEAD
            git pull --rebase origin main
            bash scripts/sync-package-docs.sh
          done

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
