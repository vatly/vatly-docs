name: Sync SDK Docs

on:
  repository_dispatch:
    types: [sync-sdk-docs, sync-laravel-docs]
  workflow_dispatch: # manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pull PHP SDK docs
        uses: actions/checkout@v4
        with:
          repository: Vatly/vatly-api-php
          path: tmp/sdk-repo
          sparse-checkout: docs

      - name: Pull Laravel package docs
        uses: actions/checkout@v4
        with:
          repository: Vatly/vatly-laravel
          path: tmp/laravel-repo
          sparse-checkout: docs

      - name: Transform and copy PHP SDK docs
        run: |
          mkdir -p tmp/sdk-docs
          cp tmp/sdk-repo/docs/*.md tmp/sdk-docs/ 2>/dev/null || true
          node scripts/transform-sdk-docs.mjs tmp/sdk-docs content/3.packages/1.php

      - name: Transform and copy Laravel docs
        run: |
          mkdir -p tmp/laravel-docs
          cp tmp/laravel-repo/docs/*.md tmp/laravel-docs/ 2>/dev/null || true
          node scripts/transform-laravel-docs.mjs tmp/laravel-docs content/3.packages/2.laravel

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Check for changes
        id: changes
        run: |
          git add content/3.packages/ public/sitemap.xml
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push (signed via GitHub API)
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Commit through the GraphQL createCommitOnBranch mutation so GitHub
          # signs the commit with its web-flow key -> shows as "Verified".
          # Attributed to github-actions[bot]; no signing key/secret to manage.
          HEAD_OID=$(git rev-parse HEAD)

          additions=$(git diff --staged --no-renames -z --name-only --diff-filter=ACM \
            | while IFS= read -r -d '' f; do
                jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" \
                  '{path: $path, contents: $contents}'
              done | jq -s '.')

          deletions=$(git diff --staged --no-renames -z --name-only --diff-filter=D \
            | while IFS= read -r -d '' f; do
                jq -n --arg path "$f" '{path: $path}'
              done | jq -s '.')

          jq -n \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }' \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg oid "$HEAD_OID" \
            --argjson additions "$additions" \
            --argjson deletions "$deletions" \
            '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: "docs: sync SDK documentation"},
                expectedHeadOid: $oid,
                fileChanges: {additions: $additions, deletions: $deletions}
            }}}' \
            | gh api graphql --input -

      - name: Build and deploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npx nuxi build
          echo "docs.vatly.com" > .output/public/CNAME
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/Vatly/vatly-docs.git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages --dotfiles -d .output/public
